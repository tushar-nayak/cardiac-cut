# Conda alternative to requirements.txt.
#   conda env create -f environment.yml
#   conda activate camp
#   jupyter notebook run_camp.ipynb
name: camp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.2
  - matplotlib>=3.7
  - trimesh>=4.0
  - networkx>=3.0
  - pyvista>=0.44
  - plotly>=5.9
  - notebook>=6.5
  - pip
  - pip:
      - pyacvd>=0.3.1
